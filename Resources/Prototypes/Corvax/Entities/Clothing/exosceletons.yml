- type: entity
  parent: ClothingOuterHardsuitBase
  id: N14ClothingOuterEXOstalker
  name: костюм "Пустошь"
  components:
  - type: Appearance
  - type: Sprite
    sprite: Corvax/Clothing/OuterClothing/Armor/stalkerEXOarmor.rsi
    layers:
    - state: icon
    scale: 1.2, 1.2
  - type: Clothing
    sprite: Corvax/Clothing/OuterClothing/Armor/stalkerEXOarmor.rsi
    slots: [ outerClothing ]
  - type: ToggleableClothing
    clothingPrototype: N14ClothingHeadHelmetEXOstalker
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: StaminaDamageResistance
    coefficient: 0.80
  - type: EmitsSoundOnMove
    soundCollection:
      collection: N14FootstepPowerArmor
      params:
        volume: -6
    requiresWorn: true
    distanceWalking: 2
    distanceSprinting: 3

- type: entity
  parent: ClothingHeadHardsuitBase
  id: N14ClothingHeadHelmetEXOstalker
  name: шлем костюма "Пустошь"
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: Corvax/Clothing/Head/Helmets/stalkerEXOhelmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: ComponentToggler
    components:
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide


