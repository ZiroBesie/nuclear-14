# Случайное событие: крушение вертибёрда
- type: entity
  id: N14VertibirdCrash
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 0 # не выбирается планировщиком — запускается пресетом N14 или триггер-предметом
    earliestStart: 0
    reoccurrenceDelay: 60
    maxOccurrences: 1
    duration: null # правило живёт весь раунд, крушение происходит по внутреннему таймеру
  - type: N14VertibirdCrashRule
    minStartDelay: 600 # 10 минут
    maxStartDelay: 3600 # 60 минут

# Предмет для принудительного запуска крушения (админский/ивентовый инструмент)
- type: entity
  parent: BaseItem
  id: N14VertibirdCrashTrigger
  name: vertibird tracking beacon
  description: A military-grade tracking device. Activating it will summon a vertibird to the area... one way or another.
  components:
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - state: flare_base
      color: "#7a9bff"
  - type: Item
    size: Small
    sprite: Objects/Misc/flare.rsi
  - type: N14VertibirdCrashTrigger
